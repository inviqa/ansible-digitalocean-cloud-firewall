---
- name: Check whether a DigitalOcean API token is available
  ansible.builtin.assert:
    that:
      - digitalocean_cloud_firewall_test_effective_api_token | length > 0
    fail_msg: >-
      Set digitalocean_cloud_firewall_test_api_token in tests/test_variables.yml
      or set test.digitalocean.api_token in workspace.override.yml or export
      DIGITAL_OCEAN_API_TOKEN before running the
      {{
        digitalocean_cloud_firewall_test_credential_context
        | default('live test harness')
      }}.
  no_log: true

- name: Validate the DigitalOcean API token
  ansible.builtin.uri:
    url: "{{ digitalocean_cloud_firewall_api_base_url }}/account"
    headers:
      Content-Type: application/json
      Authorization: >-
        Bearer {{ digitalocean_cloud_firewall_test_effective_api_token }}
    method: GET
    status_code:
      - 200
      - 401
    return_content: true
    timeout: 60
  delegate_to: localhost
  register: digitalocean_cloud_firewall_test_account_auth_check
  no_log: true
  failed_when: false

- name: Check whether the DigitalOcean API token can authenticate
  ansible.builtin.assert:
    that:
      - digitalocean_cloud_firewall_test_account_auth_check.status == 200
    fail_msg: >-
      The configured DigitalOcean token could not authenticate against the
      DigitalOcean API. Update digitalocean_cloud_firewall_test_api_token in
      tests/test_variables.yml, set a valid test.digitalocean.api_token in
      workspace.override.yml, or export DIGITAL_OCEAN_API_TOKEN before running
      the
      {{
        digitalocean_cloud_firewall_test_credential_context
        | default('live test harness')
      }}.
  no_log: true
