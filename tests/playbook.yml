---
- name: Test DigitalOcean Cloud Firewall membership
  hosts: digitalocean_cloud_firewall
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_connection: local
    digitalocean_cloud_firewall_api_base_url: >-
      https://api.digitalocean.com/v2
    digitalocean_cloud_firewall_test_api_token_from_env: >-
      {{
        lookup('env', 'DIGITAL_OCEAN_API_TOKEN')
        | default(lookup('env', 'DO_OAUTH_TOKEN'), true)
      }}
    digitalocean_cloud_firewall_test_effective_api_token: >-
      {{
        digitalocean_cloud_firewall_test_api_token_from_env
        | default(
            digitalocean_cloud_firewall_test_api_token | default('', true),
            true
          )
      }}
    digitalocean_cloud_firewall_test_region_id: "lon1"
    digitalocean_cloud_firewall_test_size_id: "s-1vcpu-1gb"
    digitalocean_cloud_firewall_test_tag: "ANSIBLE-TEST"
    digitalocean_cloud_firewall_test_ssh_keys_from_env: >-
      {{
        lookup('env', 'DIGITAL_OCEAN_SSH_KEYS')
        | default('', true)
        | regex_replace('\r?\n', ',')
        | split(',')
        | map('trim')
        | map('regex_replace', '^\[', '')
        | map('regex_replace', '\]$', '')
        | map('regex_replace', '^-\\s*', '')
        | map('trim')
        | map('regex_replace', '^"', '')
        | map('regex_replace', '"$', '')
        | map('regex_replace', "^'", '')
        | map('regex_replace', "'$", '')
        | reject('equalto', '')
        | list
      }}
    digitalocean_cloud_firewall_test_effective_ssh_keys: >-
      {{
        digitalocean_cloud_firewall_test_ssh_keys_from_env
        | default(
            digitalocean_cloud_firewall_test_ssh_keys | default([], true),
            true
          )
      }}
    digitalocean_cloud_firewall_test_project_name_from_env: >-
      {{
        lookup('env', 'DIGITAL_OCEAN_PROJECT_NAME')
        | default('', true)
      }}
    digitalocean_cloud_firewall_test_effective_project_name: >-
      {{
        digitalocean_cloud_firewall_test_project_name_from_env
        | default(
            digitalocean_cloud_firewall_test_project_name | default('', true),
            true
          )
      }}
    digitalocean_cloud_firewall_test_resource_name: >-
      ansible-digitalocean-cloud-firewall-{{ inventory_hostname }}
  pre_tasks:
    - name: Load local test overrides
      ansible.builtin.include_tasks: tasks/load_local_test_overrides.yml

    - name: Validate DigitalOcean test credentials
      ansible.builtin.include_tasks: tasks/validate_digitalocean_credentials.yml
      vars:
        digitalocean_cloud_firewall_test_credential_context: live test harness
  tasks:
    - name: Create test Cloud Firewall
      digitalocean.cloud.firewall:
        token: "{{ digitalocean_cloud_firewall_test_effective_api_token }}"
        name: "{{ digitalocean_cloud_firewall_test_resource_name }}"
        state: present
        inbound_rules:
          - protocol: tcp
            ports: "22"
            sources:
              addresses:
                - "0.0.0.0/0"
                - "::/0"
        outbound_rules:
          - protocol: tcp
            ports: "1-65535"
            destinations:
              addresses:
                - "0.0.0.0/0"
                - "::/0"
          - protocol: udp
            ports: "1-65535"
            destinations:
              addresses:
                - "0.0.0.0/0"
                - "::/0"
          - protocol: icmp
            ports: "1-65535"
            destinations:
              addresses:
                - "0.0.0.0/0"
                - "::/0"
        tags:
          - "{{ digitalocean_cloud_firewall_test_tag }}"
        timeout: 60
      delegate_to: localhost
      register: digitalocean_cloud_firewall_test_firewall_create
      no_log: true

    - name: Store test Cloud Firewall details
      ansible.builtin.set_fact:
        digitalocean_cloud_firewall_test_firewall: >-
          {{ digitalocean_cloud_firewall_test_firewall_create.firewall }}

    - name: Create test Droplet
      digitalocean.cloud.droplet:
        token: "{{ digitalocean_cloud_firewall_test_effective_api_token }}"
        name: "{{ digitalocean_cloud_firewall_test_resource_name }}"
        unique_name: true
        region: "{{ digitalocean_cloud_firewall_test_region_id }}"
        image: "{{ do_image_id }}"
        size: "{{ digitalocean_cloud_firewall_test_size_id }}"
        ssh_keys: "{{ digitalocean_cloud_firewall_test_effective_ssh_keys }}"
        tags:
          - "{{ digitalocean_cloud_firewall_test_tag }}"
        timeout: 300
      delegate_to: localhost
      register: digitalocean_cloud_firewall_test_droplet_create
      no_log: true

    - name: Assign the test Droplet to the DigitalOcean project
      digitalocean.cloud.project_resources:
        state: present
        project_name: "{{ digitalocean_cloud_firewall_test_effective_project_name }}"
        token: "{{ digitalocean_cloud_firewall_test_effective_api_token }}"
        resources:
          - "do:droplet:{{ digitalocean_cloud_firewall_test_droplet_create.droplet.id }}"
      delegate_to: localhost
      no_log: true
      when: digitalocean_cloud_firewall_test_effective_project_name | length > 0

    - name: Store test Droplet ID
      ansible.builtin.set_fact:
        digitalocean_cloud_firewall_test_droplet_id: >-
          {{ digitalocean_cloud_firewall_test_droplet_create.droplet.id }}

    - name: Attach Droplet to test Cloud Firewall
      ansible.builtin.include_role:
        name: digitalocean_cloud_firewall
      vars:
        digitalocean_cloud_firewall_api_token: >-
          {{ digitalocean_cloud_firewall_test_effective_api_token }}
        digitalocean_cloud_firewall_droplet_id: >-
          {{ digitalocean_cloud_firewall_test_droplet_id }}
        digitalocean_cloud_firewall_name: >-
          {{ digitalocean_cloud_firewall_test_resource_name }}

    - name: Validate attached test result
      ansible.builtin.include_tasks: tasks/test_tasks.yml
